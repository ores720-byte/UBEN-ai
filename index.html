<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b1049">
<title>UBEN Ai</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar closed" id="sidebar" aria-label="Sessions">
    <button class="new-chat" id="newChat"><i class="fa-solid fa-pen-to-square"></i> New session</button>
    <div class="side-label">Recent</div>
    <nav id="history" aria-label="Recent sessions"></nav>
    <div class="side-foot"><span class="avatar">UA</span><span>UBEN Ai · Study help</span></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSide" aria-label="Toggle sidebar" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
      <span class="brand">UBEN Ai</span>
      <div class="spacer"></div>
      <nav class="tabs" id="tabs" aria-label="Sections">
        <button class="tab on" data-tab="study">Study</button>
        <button class="tab" data-tab="write">Write</button>
        <button class="tab" data-tab="tools">Tools</button>
        <button class="tab" data-tab="progress">Progress</button>
      </nav>
      <div class="spacer"></div>
      <button class="icon-btn has-dot" id="connBtn" aria-label="AI connection and API key"><i class="fa-solid fa-gear"></i><span class="conn-dot" id="connDot"></span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread" role="log" aria-live="polite"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="settings-panel hide" id="settings" role="region" aria-label="Study settings">
          <div class="set-head">
            <span>Study settings</span>
            <button class="chip-select" id="settingsDone" type="button">Done</button>
          </div>
          <div class="set-grid">
            <fieldset class="set-group">
              <legend>Quiz</legend>
              <label class="field">Difficulty
                <select id="difficulty"><option>easy</option><option selected>medium</option><option>hard</option></select>
              </label>
              <label class="field">Items per set
                <input type="number" id="count" min="1" max="20" value="5">
              </label>
              <label class="check"><input type="checkbox" id="timed"> Timed (30 s per question)</label>
              <label class="check"><input type="checkbox" id="autodiff"> Adjust difficulty to my scores</label>
            </fieldset>
            <fieldset class="set-group">
              <legend>Study plan</legend>
              <label class="field">Days to exam
                <input type="number" id="days" min="1" max="120" value="7">
              </label>
              <label class="field">Minutes a day
                <input type="number" id="mins" min="10" max="480" value="60">
              </label>
            </fieldset>
            <fieldset class="set-group">
              <legend>Translation</legend>
              <label class="field">Translate to
                <select id="lang"><option>Yoruba</option><option>Hausa</option><option>Igbo</option><option>French</option><option>Nigerian Pidgin</option></select>
              </label>
            </fieldset>
          </div>
          <p class="set-hint">Changes apply to the next set you generate.</p>
        </div>

        <div class="chips" id="chips" role="group" aria-label="Action"></div>

        <div class="composer-box">
          <textarea id="text" rows="1" aria-label="Your notes or topic" placeholder="Paste notes or describe a topic..."></textarea>
          <div class="composer-row">
            <label class="attach" title="Attach a .pdf, .docx or .txt file">
              <i class="fa-solid fa-paperclip"></i> File
              <input type="file" id="file" accept=".txt,.pdf,.docx" hidden>
            </label>
            <button class="chip-select" id="settingsBtn" aria-expanded="false"><i class="fa-solid fa-sliders"></i> Settings</button>
            <span class="spacer"></span>
            <button class="send" id="send" aria-label="Run"><i class="fa-solid fa-arrow-up"></i></button>
          </div>
        </div>
        <button class="file-name hide" id="fileName" title="Remove file"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
